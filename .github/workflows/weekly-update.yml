# The automated update: imports new data for every sport, predicts upcoming games, and commits
# the predictions to records/ (live_predictions.csv for the Premier League,
# nfl_live_predictions.csv for the NFL) before kickoff.
#
# Runs on Tuesdays and Fridays, at two times in case data is posted late. Tuesday covers
# midweek football and Thursday night NFL games; Friday covers the weekend. GitHub can start
# scheduled runs up to an hour late; the prediction scripts never touch a game that has
# already kicked off, so a late run can't produce an after-kickoff prediction.
name: Weekly update

# The update now runs twice a day on the Mac (scheduled/install.sh), which commits nothing by
# itself: its records/ changes are committed with GitHub Desktop. The schedule below is switched
# off so the two don't both write records/ (and the full run, NBA backtest included, no longer fits
# in this job's time limit). The "Run workflow" button still works for a one-off run.
on:
  # schedule:
  #   - cron: "0 17 * * 2,5"   # Tuesdays and Fridays at 17:00 UTC (6pm UK, 1pm Eastern)
  #   - cron: "0 21 * * 2,5"   # and again at 21:00 UTC (10pm UK, 5pm Eastern)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write             # allows the run to commit the prediction records

concurrency:
  group: weekly-update        # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the tests (nothing is updated if any fail)
        id: tests
        run: pytest

      - name: Restore previously downloaded data files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - name: Update data and predictions for every sport
        run: python update.py --record

      # Runs even if one sport's update failed, so the other sport's predictions are still
      # saved; the run is still marked as failed so the problem shows up. Skipped if the tests failed.
      - name: Commit the prediction records and availability snapshot
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add records/
          if git diff --cached --quiet; then
            echo "No new or changed records."
          else
            git commit -m "Record predictions and availability ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi